<!-- Primary Button Component -->

<!-- Basic Button -->
<button class="btn-primary">Click Me</button>

<!-- Button with Icon (SVG) -->
<button class="btn-primary">
  <span class="icon">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 2L12 8H18L13 12L15 18L10 14L5 18L7 12L2 8H8L10 2Z" fill="currentColor"/>
    </svg>
  </span>
  Learn More
</button>

<!-- Button with Different Icons -->
<button class="btn-primary">
  <span class="icon">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 10L13 5M13 5V11M13 5H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  Get Started
</button>

<!-- Button States Demo -->
<div style="display: flex; gap: 1rem; flex-wrap: wrap;">
  <button class="btn-primary">Normal</button>
  <button class="btn-primary" disabled>Disabled</button>
</div>
