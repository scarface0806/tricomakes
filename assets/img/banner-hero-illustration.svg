<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>

    <!-- Glass morphism effect -->
    <filter id="glassBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>

    <!-- Soft glow filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orange glow for CTA -->
    <filter id="orangeGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.3" flood-color="#000000"/>
    </filter>

    <!-- Blur circles -->
    <radialGradient id="blurGrad1">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="blurGrad2">
      <stop offset="0%" style="stop-color:#FF6A3D;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF6A3D;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Floating blur circles (background) -->
  <circle cx="300" cy="200" r="250" fill="url(#blurGrad1)" filter="url(#glassBlur)"/>
  <circle cx="1700" cy="850" r="300" fill="url(#blurGrad2)" filter="url(#glassBlur)"/>
  <circle cx="200" cy="900" r="200" fill="url(#blurGrad2)" filter="url(#glassBlur)" opacity="0.5"/>

  <!-- Background layered cards (depth) -->
  <!-- Card 1 (back) -->
  <g transform="translate(850, 520) rotate(-8) skewY(2)">
    <rect x="-280" y="-200" width="560" height="400" rx="20" fill="#1a1a2e" opacity="0.4" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- Card 2 (middle back) -->
  <g transform="translate(920, 540) rotate(-3) skewY(1)">
    <rect x="-280" y="-200" width="560" height="400" rx="20" fill="#2a2a4e" opacity="0.5" stroke="#FF6A3D" stroke-width="1" stroke-opacity="0.15"/>
  </g>

  <!-- Main central card with glassmorphism -->
  <g filter="url(#softShadow)" transform="translate(960, 520)">
    <!-- Glass background -->
    <defs>
      <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
        <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
      </linearGradient>
    </defs>

    <!-- Main card container -->
    <g transform="rotate(-2) skewY(0.5)">
      <rect x="-320" y="-240" width="640" height="480" rx="28" fill="url(#cardGlass)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>
      
      <!-- Top bar with 3 lines -->
      <line x1="-300" y1="-210" x2="-100" y2="-210" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <line x1="-300" y1="-190" x2="-80" y2="-190" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <line x1="-300" y1="-170" x2="-120" y2="-170" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

      <!-- Left side: Large image/content block -->
      <rect x="-300" y="-140" width="200" height="280" rx="12" fill="#2a2a4e" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.4" opacity="0.7"/>
      
      <!-- Image placeholder pattern -->
      <circle cx="-200" cy="-30" r="25" fill="#6C63FF" opacity="0.3"/>
      <line x1="-240" y1="-60" x2="-160" y2="-60" stroke="#6C63FF" stroke-width="2" stroke-opacity="0.2"/>
      <line x1="-240" y1="-40" x2="-160" y2="-40" stroke="#6C63FF" stroke-width="2" stroke-opacity="0.2"/>

      <!-- Right side: UI blocks -->
      <!-- Top right block (grey) -->
      <rect x="50" y="-140" width="250" height="60" rx="10" fill="#3a3a5e" stroke="#999999" stroke-width="1" stroke-opacity="0.3" opacity="0.8"/>
      <line x1="70" y1="-120" x2="270" y2="-120" stroke="#cccccc" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="70" y1="-100" x2="250" y2="-100" stroke="#cccccc" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

      <!-- Primary CTA block (Orange) with glow -->
      <g filter="url(#orangeGlow)">
        <rect x="50" y="-65" width="250" height="65" rx="12" fill="#FF6A3D" opacity="0.95"/>
        <text x="175" y="-25" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#ffffff" opacity="0.9">Launch Project</text>
      </g>

      <!-- Secondary block 1 (grey) -->
      <rect x="50" y="20" width="115" height="55" rx="10" fill="#3a3a5e" stroke="#666666" stroke-width="1" stroke-opacity="0.3" opacity="0.7"/>
      <line x1="65" y1="35" x2="185" y2="35" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <line x1="65" y1="50" x2="185" y2="50" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

      <!-- Secondary block 2 (grey) -->
      <rect x="185" y="20" width="115" height="55" rx="10" fill="#3a3a5e" stroke="#666666" stroke-width="1" stroke-opacity="0.3" opacity="0.7"/>
      <line x1="200" y1="35" x2="280" y2="35" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <line x1="200" y1="50" x2="280" y2="50" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

      <!-- Bottom content area -->
      <rect x="-300" y="160" width="550" height="40" rx="8" fill="#3a3a5e" opacity="0.5" stroke="#999999" stroke-width="0.5" stroke-opacity="0.2"/>
      <line x1="-285" y1="175" x2="240" y2="175" stroke="#cccccc" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

      <!-- Branding at bottom of card -->
      <text x="0" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff" opacity="0.95">TRICO MAKES</text>
      <text x="0" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FF6A3D" opacity="0.8" letter-spacing="2">PROJECT PLACEHOLDER</text>
    </g>
  </g>

  <!-- Accent glow lines around main card -->
  <g opacity="0.3">
    <line x1="500" y1="200" x2="900" y2="200" stroke="#6C63FF" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="1020" y1="200" x2="1420" y2="200" stroke="#FF6A3D" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Bottom accent -->
  <g opacity="0.25">
    <line x1="600" y1="900" x2="1320" y2="900" stroke="#6C63FF" stroke-width="1.5"/>
  </g>

  <!-- Floating particles/dots -->
  <g opacity="0.4">
    <circle cx="400" cy="300" r="3" fill="#FF6A3D"/>
    <circle cx="1600" cy="400" r="2.5" fill="#6C63FF"/>
    <circle cx="300" cy="650" r="2" fill="#FF6A3D"/>
    <circle cx="1700" cy="200" r="3" fill="#6C63FF"/>
    <circle cx="800" cy="950" r="2" fill="#FF6A3D"/>
  </g>
</svg>