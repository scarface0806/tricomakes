<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Gallery Placeholder</title>
  <desc id="desc">Branded placeholder image for gallery tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#f3e6d8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#f54200"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="90" y="90" width="620" height="620" rx="40" fill="#ffffff"/>
  <rect x="150" y="150" width="500" height="300" rx="28" fill="url(#accent)"/>
  <rect x="150" y="490" width="210" height="24" rx="12" fill="#120f12" opacity="0.8"/>
  <rect x="150" y="532" width="360" height="18" rx="9" fill="#120f12" opacity="0.18"/>
  <circle cx="598" cy="560" r="58" fill="#120f12" opacity="0.08"/>
  <text x="150" y="622" fill="#f54200" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">GALLERY TILE</text>
</svg>